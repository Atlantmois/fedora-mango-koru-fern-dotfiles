# MangoWC 0.18.0 — keys selected from ~/.config/niri/config.kdl
# Mod in the local Niri TTY session means Super.


# Launcher, clipboard and screenshot
bind=SUPER,space,spawn,~/.config/mango/scripts/run-app.sh rofi -config ~/.config/mango/rofi/config.rasi -show drun
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/screenshot.sh
bind=SUPER,v,spawn,~/.config/mango/scripts/clipboard.sh

# Window control
# Super+F sets the scroller column to full width; Super+R restores a preset.
# Mango has no identical Niri maximize-column toggle.
bind=SUPER,q,killclient
bind=SUPER+SHIFT,v,togglefloating
bind=SUPER,f,set_proportion,1.0
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,o,toggleoverview
bind=ALT,Tab,togglejump

# Window focus: user-selected HJKL; Ctrl+arrows retain the existing move bindings.
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Move with HJKL, matching the active Niri bindings.
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right

# Monitor focus / move the focused window to a monitor
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,Up,tagmon,up
bind=SUPER+CTRL+SHIFT,Down,tagmon,down

# Workspace navigation and moving the focused window
# Mango has fixed tags and acts on a window, not a whole Niri column.
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
# User-selected workspace navigation aliases.
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0

# Move the focused window to the previous/next tag with I/U.
bind=SUPER+CTRL,i,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=CTRL+SUPER,Page_Up,tagtoleft,0
bind=CTRL+SUPER,Page_Down,tagtoright,0
bind=CTRL+SUPER,1,tag,1,0
bind=CTRL+SUPER,2,tag,2,0
bind=CTRL+SUPER,3,tag,3,0
bind=CTRL+SUPER,4,tag,4,0
bind=CTRL+SUPER,5,tag,5,0
bind=CTRL+SUPER,6,tag,6,0
bind=CTRL+SUPER,7,tag,7,0
bind=CTRL+SUPER,8,tag,8,0
bind=CTRL+SUPER,9,tag,9,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Width presets and fine size adjustment
# Mango resizewin accepts logical pixels, not percentages: use 50px steps.
bind=SUPER,r,switch_proportion_preset
bind=SUPER+SHIFT,r,switch_proportion_preset,prev
bind=SUPER,minus,resizewin,-50,0
bind=SUPER,equal,resizewin,+50,0
bind=SUPER+SHIFT,minus,resizewin,0,-50
bind=SUPER+SHIFT,equal,resizewin,0,+50

# Join/leave a scroller stack, matching Niri's consume-or-expel keys.
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# Session and notifications
# Mango quit has no confirmation dialog; use deliberately.
# Reload moved away from Niri's preset-height key.
bind=SUPER+ALT,r,reload_config
bind=SUPER+SHIFT,e,quit
bind=SUPER+ALT,l,spawn,swaylock -f -C ~/.config/swaylock/config
bind=CTRL+ALT,backslash,spawn,swaync-client -t
bind=CTRL+ALT,BackSpace,spawn,swaync-client -C
bind=SUPER+SHIFT,p,sleep_monitor

# Media and brightness: retain the existing tools; available when locked
bindl=none,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh up
bindl=none,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume.sh down
bindl=none,XF86AudioMute,spawn,~/.config/mango/scripts/volume.sh mute
bindl=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bindl=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down
bindl=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=none,XF86AudioPlay,spawn,playerctl play-pause
bindl=none,XF86AudioStop,spawn,playerctl stop
bindl=none,XF86AudioPrev,spawn,playerctl previous
bindl=none,XF86AudioNext,spawn,playerctl next

# Mouse: plain clicks and middle-button paste pass to applications
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Explicit Super+wheel navigation; plain/Alt scrolling goes to applications.
axisbind=SUPER,UP,viewtoleft,0
axisbind=SUPER,DOWN,viewtoright,0
axisbind=SUPER+CTRL,UP,tagtoleft,0
axisbind=SUPER+CTRL,DOWN,tagtoright,0

# Existing touchpad gestures: preserved
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
