# Dialogs and rules for applications actually installed on this machine.
# Existing OBS forwarding keys, app tag placement and mpv overlay are retained.
# Effects/opacity are configured globally in config.conf.
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk,title:打开本地仓库
window_rule=is_floating:1,width:800,height:900,title:Translate
window_rule=global_key_binding:ctrl+alt-o,app_id:com.obsproject.Studio
window_rule=global_key_binding:ctrl+alt-n,app_id:com.obsproject.Studio
window_rule=no_swallow:1,title:Event Tester
window_rule=is_floating:1,width:1500,height:900,app_id:clash-verge
window_rule=is_floating:1,title:图片查看器
window_rule=is_floating:1,title:预览
window_rule=is_floating:1,title:图片查看
window_rule=is_floating:1,title:选择文件
window_rule=is_floating:1,title:打开文件
window_rule=is_floating:1,title:rofi - Networks
window_rule=is_floating:1,no_border:1,app_id:Rofi
window_rule=is_floating:1,app_id:xfce-polkit
window_rule=force_fake_maximize:1,app_id:firefox
window_rule=tags:3,app_id:QQ
window_rule=tags:2,app_id:mpv
window_rule=tags:6,app_id:obs
window_rule=is_floating:1,is_overlay:1,no_border:1,is_unmanaged_global:1,width:280,height:200,offset_x:9999,offset_y:9999,app_id:mpv,title:video0 - mpv
window_rule=is_overlay:1,app_id:^com.gabm.satty$

# Original per-window and layer animation exceptions, restored from backup.
window_rule=animation_type_open:none,app_id:flameshot
window_rule=animation_type_close:none,app_id:flameshot
window_rule=animation_type_open:slide,app_id:yesplaymusic
window_rule=animation_type_close:slide,app_id:yesplaymusic
window_rule=animation_type_open:slide,animation_type_close:slide,app_id:clash-verge
window_rule=animation_type_open:none,animation_type_close:none,app_id:^wps$,title:^wps$
window_rule=animation_type_open:zoom,title:图片查看器
window_rule=animation_type_open:zoom,title:图片查看
window_rule=animation_type_open:zoom,title:选择文件
window_rule=animation_type_open:zoom,title:打开文件
window_rule=animation_type_open:zoom,app_id:python3,title:qxdrag
window_rule=animation_type_open:zoom,title:rofi - Networks
window_rule=animation_type_open:slide,app_id:Rofi
window_rule=animation_type_close:zoom,app_id:Rofi
window_rule=animation_type_open:zoom,app_id:qxdrag.py
window_rule=animation_type_open:zoom,app_id:python3,title:qxdrag
window_rule=animation_type_close:zoom,app_id:qxdrag.py
window_rule=animation_type_close:zoom,app_id:python3,title:qxdrag
window_rule=animation_type_close:zoom,app_id:^com.gabm.satty$
window_rule=animation_type_open:none,no_fade_in:1,title:wechat
window_rule=animation_type_close:none,no_fade_out:1,title:wechat
layer_rule=no_animation:1,layer_name:selection
layer_rule=no_animation:1,layer_name:dimland_layer
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=no_animation:1,layer_name:hyprpicker
layer_rule=no_animation:1,layer_name:showkeys
layer_rule=no_animation:1,layer_name:wofi
layer_rule=animation_type_open:fade,layer_name:swaync-control-center
layer_rule=animation_type_close:fade,layer_name:swaync-control-center
layer_rule=animation_type_open:fade,layer_name:swayosd
layer_rule=animation_type_close:fade,layer_name:swayosd
