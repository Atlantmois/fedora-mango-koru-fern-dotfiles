# Koru Fern — MangoWC 0.18.0
# Compositor effects; application themes and Ghostty Shader are independent.
blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.7
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=400
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.58,0.98,0.58,0.98
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=8
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=0
# Respect the selected width even with one window (verified in 0.18.0 source).
scroller_ignore_proportion_single=1
scroller_prefer_overspread=0
scroller_proportion_preset=0.33333,0.5,0.66667

# Restore the original hot corner; edge-scroller pointer focus remains disabled.
hotarea_size=10
enable_hotarea=1
overview_gap_inner=8
overview_gap_outer=30

# Misc
xwayland_persistence=1
xwayland_ignore_scale=1
sync_obj_enable=1
no_border_when_single=0
smart_gaps=0
axis_bind_apply_timeout=100
focus_on_activate=1
# Click to focus, matching the local Niri configuration.
# Edge focus, ordinary mouse focus and keyboard cursor warping are distinct.
sloppy_focus=0
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=50
cursor_size=24
# Koru cursor: previous Mango theme was Adwaita; backup retained.
cursor_theme=Bibata-Modern-Koru
cursor_hide_timeout=0
drag_tile_to_tile=1
# Keep plain border dragging and Super+mouse move/resize available.
enable_border_resize=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=1
mouse_accel_speed=0.0

# Appearance
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
border_px=2
root_color=0x171E1Aff
border_color=0x425347ff
focus_color=0xE6D87Aff
drop_color=0x8FBF8855
split_color=0xE6D87Aff
maximized_screen_color=0xE6D87Aff
urgent_color=0xD39B79ff
scratchpad_color=0xE6D87Aff
global_color=0xE6D87Aff
overlay_color=0xE6D87Aff

# sub config load
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# run autostart
exec_once=~/.config/mango/autostart.sh

# Night light is started once in autostart.sh (4200K, as requested).
